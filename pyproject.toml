[project]
name = "mizito-mcp"
version = "0.3.0"
description = "MCP server that exposes a Mizito workspace (chats, projects, tasks, calendar, letters, minutes, polls, files, CRM) to Claude and ChatGPT"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp[cli]>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5",
]
